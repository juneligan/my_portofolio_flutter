name: my_portfolio_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  telephone_check: ^0.1.0 # for checking the msisdn format
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.2
  storybook_flutter: ^0.14.1
  json_annotation: ^4.9.0
  intl: ^0.20.2
  fluttertoast: ^8.2.12

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # auto generator
  build_runner: ^2.4.15 # to auto generate the below dependencies
  json_serializable: ^6.9.4

  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/projects/